server {
    listen 80;
    server_name localhost;

    # Configuração da SPA (Angular)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # Fallback para o Angular Router
        try_files $uri $uri/ /index.html;
    }

    # Proxy Reverso para o Spring Boot
    location /api/ {
        # 'backend' deve ser exatamente o nome do serviço no seu docker-compose.yml
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        
        # Repassa os cabeçalhos originais para o Spring Boot
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}